name: Kraken AI checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app tests
      - run: pytest -q
        env:
          APP_PASSWORD: test_password_at_least_16_characters
          EVIDENCE_RERANKER: lexical
