name: Security and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR and Russian recognition data
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      - name: Install packages
        run: pip install -r requirements.txt pytest httpx pip-audit bandit
      - name: Verify frontend JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/mascot.js
          node --check app/static/tentacles.js
      - name: Validate browser scripts
        run: |
          node --check app/static/mascot.js
          node --check app/static/markdown.js
          node --check app/static/app.js
      - name: Test
        env:
          APP_PASSWORD: github_actions_test_password_please_change
        run: python -m pytest -q
      - name: Security audit
        run: pip-audit -r requirements.txt
      - name: Static security analysis
        run: bandit -r app -x app/static
