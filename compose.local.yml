# Local/on-premise mode. Ollama is NOT published to the Internet.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      AI_BACKEND: ollama
      AI_MODEL: ${AI_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_URL: http://ollama:11434/api/chat
    depends_on:
      - ollama
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  ollama_models:
